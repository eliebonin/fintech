services:
  postgres:
    image: postgres:18
    container_name: ${POSTGRES_CONTAINER_NAME:-platform-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform_secm}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    ports:
      - "127.0.0.1:15432:5432"
    secrets:
      - postgres_admin_password
    volumes:
      - platform_security_master_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  platform_security_master_postgres:
    name: ${POSTGRES_VOLUME_NAME:-platform_security_master_postgres}

secrets:
  postgres_admin_password:
    file: ./.local-secrets/postgres-admin-password
