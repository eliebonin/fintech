services:
  postgres:
    image: postgres:18
    container_name: ${POSTGRES_CONTAINER_NAME:-platform-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform_secm}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_local_only}
    ports:
      - "54329:5432"
    volumes:
      - platform_security_master_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  platform_security_master_postgres:
    name: ${POSTGRES_VOLUME_NAME:-platform_security_master_postgres}
