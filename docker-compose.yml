services:
  postgres:
    image: postgres:18
    container_name: fortem-security-master-postgres
    environment:
      POSTGRES_DB: fortem_secm
      POSTGRES_USER: fortem
      POSTGRES_PASSWORD: fortem_local_only
    ports:
      - "54329:5432"
    volumes:
      - fortem_security_master_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortem -d fortem_secm"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fortem_security_master_postgres:
