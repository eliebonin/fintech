name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://fortem:fortem_local_only@localhost:54329/fortem_secm
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fortem_secm
          POSTGRES_USER: fortem
          POSTGRES_PASSWORD: fortem_local_only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U fortem -d fortem_secm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m compileall apps market_data positions valuation packages scripts tests
      - run: python scripts/export_openapi_contract.py --check
      - run: python -m pytest -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api-contracts generate:check
      - run: pnpm --filter api-contracts typecheck
      - run: pnpm --filter api-contracts test
      - run: pnpm --filter ops-console typecheck
      - run: pnpm --filter ops-console test
      - run: pnpm --filter ops-console build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
